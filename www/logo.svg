<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <style>
    .c { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .l { stroke: #33ff66; animation: l 1.6s ease-in-out infinite; }
    .r { stroke: #33ff66; animation: r 1.6s ease-in-out infinite; }
    .s { stroke: #00e5ff; transform-origin: 54px 54px; animation: s 1.6s ease-in-out infinite; }
    @keyframes l { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-6px); } }
    @keyframes r { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @keyframes s { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.9); } }
  </style>
  <path class="c l" d="M42,38 L28,54 L42,70"/>
  <path class="c r" d="M66,38 L80,54 L66,70"/>
  <path class="c s" d="M59,34 L49,74"/>
</svg>
